name: Publier NounouCalc

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site et son identifiant technique
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'docs' ./ _site/
          printf '{"build":"%s"}\n' "$GITHUB_SHA" > _site/build.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
